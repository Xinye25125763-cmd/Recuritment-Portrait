<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招画像系统 · 人才画像</title>
<link rel="stylesheet" href="./src/design-system.css">
<script src="./vendor/vue.global.prod.js"></script>
<script src="./src/schema.js"></script>
<style>
  #app{max-width:1180px;margin:0 auto;padding:0 var(--space-6) var(--space-16)}
  header{margin:0 calc(var(--space-6) * -1) var(--space-6);padding:var(--space-3) var(--space-6)}

  .card{padding:var(--space-6) var(--space-8);margin-bottom:var(--space-5)}
  .card-title{font-size:var(--text-md);font-weight:600;letter-spacing:-0.02em;margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-2)}
  .card-title .icon{color:var(--brand-600);font-size:var(--text-sm)}

  /* 空状态 */
  .empty{text-align:center;padding:var(--space-16) var(--space-6);color:var(--ink-3)}
  .empty h2{font-size:var(--text-lg);color:var(--ink);margin-bottom:var(--space-2)}
  .empty-icon{font-size:56px;margin-bottom:var(--space-4);opacity:.35}
  .empty-steps{display:flex;gap:var(--space-5);justify-content:center;margin:var(--space-6) 0;flex-wrap:wrap}
  .empty-step{font-size:var(--text-sm);color:var(--ink-2);display:flex;align-items:center;gap:var(--space-1)}
  .empty-step .num{width:22px;height:22px;border-radius:50%;background:var(--brand-50);color:var(--brand-600);display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:600}

  /* 概览区 */
  .hero{display:flex;gap:var(--space-6);align-items:flex-start;flex-wrap:wrap}
  .avatar{
    width:72px;height:72px;border-radius:50%;background:var(--brand-50);
    display:flex;align-items:center;justify-content:center;font-size:28px;
    color:var(--brand-600);font-weight:600;flex-shrink:0;
    box-shadow:0 2px 8px rgba(43,93,79,0.08);
  }
  .hero-body{flex:1;min-width:260px}
  .hero-name{font-size:var(--text-xl);font-weight:600;margin-bottom:var(--space-1);letter-spacing:-0.03em}
  .hero-meta{color:var(--ink-2);font-size:var(--text-sm);margin-bottom:var(--space-3)}
  .hero-pitch{
    font-size:var(--text-base);color:var(--ink-2);line-height:1.8;padding:var(--space-3) var(--space-4);
    background:var(--gray-100);border-radius:var(--radius-md);border-left:3px solid var(--brand-600);
  }
  .tags{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
  .tag{
    font-size:var(--text-xs);padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);
    background:var(--brand-50);color:var(--brand-600);border:1px solid var(--brand-200);
  }
  .tag-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0dcc0}

  /* 时间轴 */
  .timeline{position:relative;padding-left:24px}
  .timeline::before{
    content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;
    background:var(--border);
  }
  .t-item{position:relative;margin-bottom:var(--space-5)}
  .t-item::before{
    content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;
    border-radius:50%;background:var(--brand-600);border:2px solid var(--card);
    box-shadow:0 0 0 2px var(--brand-100);
  }
  .t-header{display:flex;gap:var(--space-2);align-items:baseline;flex-wrap:wrap;margin-bottom:var(--space-1)}
  .t-company{font-weight:600;font-size:var(--text-base)}
  .t-role{color:var(--ink-2);font-size:var(--text-sm)}
  .t-time{color:var(--ink-3);font-size:var(--text-xs);white-space:nowrap}
  .t-type{font-size:11px;padding:1px 7px;border-radius:var(--radius-full);background:var(--gray-100);color:var(--ink-2);margin-left:auto}
  .t-highlights{font-size:var(--text-sm);color:var(--ink-2);line-height:1.7;margin-top:var(--space-1)}
  .t-highlights li{margin-left:16px;margin-bottom:3px}

  /* 雷达图 */
  .radar-wrap{display:flex;gap:var(--space-8);align-items:center;flex-wrap:wrap}
  .radar-svg{flex-shrink:0}
  .radar-legend{flex:1;min-width:200px}
  .radar-legend-item{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);font-size:var(--text-sm)}
  .radar-legend-bar{flex:1;height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;max-width:160px}
  .radar-legend-fill{height:100%;background:var(--brand-600);border-radius:3px}
  .radar-legend-score{color:var(--brand-600);font-weight:600;min-width:28px;text-align:right}

  /* 岗位矩阵 */
  .fit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-3)}
  .fit-card{
    border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);
    transition:var(--transition-normal);cursor:default;background:var(--card);
    box-shadow:var(--card-shadow);
  }
  .fit-card:hover{box-shadow:var(--card-shadow-hover);border-color:var(--gray-300)}
  .fit-card.strong{border-left:3px solid var(--brand-600)}
  .fit-card.medium{border-left:3px solid var(--warn)}
  .fit-card.weak{border-left:3px solid var(--gray-300)}
  .fit-header{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
  .fit-name{font-weight:600;font-size:var(--text-sm)}
  .fit-badge{font-size:11px;padding:2px 8px;border-radius:var(--radius-full)}
  .fit-badge.strong{background:var(--brand-50);color:var(--brand-600)}
  .fit-badge.medium{background:var(--warn-soft);color:var(--warn)}
  .fit-badge.weak{background:var(--gray-100);color:var(--ink-3)}
  .fit-bar{height:5px;background:var(--gray-200);border-radius:3px;margin-bottom:var(--space-2);overflow:hidden}
  .fit-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
  .fit-reasons{font-size:var(--text-xs);color:var(--ink-2);line-height:1.7}
  .fit-reasons li{margin-left:15px;margin-bottom:2px}

  /* 优势短板 */
  .sw-wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
  @media(max-width:640px){.sw-wrap{grid-template-columns:1fr}}
  .sw-list{font-size:var(--text-sm);color:var(--ink-2);line-height:1.8}
  .sw-list li{margin-left:18px;margin-bottom:5px}
  .sw-strength .card-title{color:var(--brand-600)}
  .sw-weak .card-title{color:var(--danger)}

  /* 建议 */
  .advice-box{
    background:var(--brand-50);border:1px solid var(--brand-200);border-radius:var(--radius-md);
    padding:var(--space-4) var(--space-5);font-size:var(--text-sm);color:var(--ink-2);line-height:1.8;
  }
  .advice-box strong{color:var(--brand-600)}

  /* 导出区 */
  .export-area{margin-top:var(--space-5);padding-top:var(--space-5);border-top:1px solid var(--border)}
  .export-btns{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .text-export{
    width:100%;margin-top:var(--space-3);padding:var(--space-4);font-size:var(--text-xs);
    border:1px solid var(--border);border-radius:var(--radius-md);background:var(--gray-50);
    color:var(--ink-2);line-height:1.7;white-space:pre-wrap;min-height:120px;
    font-family:inherit;resize:vertical;
  }

  /* 编辑面板 */
  .edit-panel{background:var(--brand-50);border:1px solid var(--brand-200);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-8);margin-bottom:var(--space-5)}
  .edit-title{font-size:var(--text-md);font-weight:600;color:var(--brand-600);margin-bottom:var(--space-4)}
  .edit-row{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);flex-wrap:wrap}
  .edit-row label{min-width:80px;font-size:var(--text-sm);color:var(--ink-2)}
  .edit-row input[type=range]{flex:1;min-width:120px}
  .edit-row input[type=number]{width:56px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-xs)}
  .edit-row input[type=text],.edit-row textarea{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--text-xs);font-family:inherit}
  .edit-row textarea{min-height:60px;resize:vertical}
  .edit-value{font-size:var(--text-xs);color:var(--brand-600);font-weight:600;min-width:24px}
  .edit-value.score-0,.edit-value.score-1,.edit-value.score-2{color:var(--danger)}
  .edit-value.score-3{color:var(--warn)}
  .edit-value.score-4,.edit-value.score-5{color:#2e7d32}
  .edit-hint{font-size:var(--text-xs);color:var(--ink-3);margin-top:var(--space-1)}
  .edit-actions{display:flex;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--brand-200)}
  .edit-table{width:100%;border-collapse:collapse;font-size:var(--text-xs);margin-top:var(--space-2)}
  .edit-table th,.edit-table td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
  .edit-table th{color:var(--ink-3);font-weight:500;font-size:var(--text-xs)}
  .edit-table td input[type=number]{width:60px}
  .edit-table td input[type=checkbox]{cursor:pointer}
  .edit-tag-input{width:100%}
  .edit-section-title{font-size:var(--text-sm);font-weight:600;color:var(--ink);margin:var(--space-4) 0 var(--space-2)}
  .edit-toggle{display:inline-block;width:18px;text-align:center;color:var(--brand-600);font-size:var(--text-xs);margin-right:4px}
  .edit-hint-reset{color:var(--danger);font-size:var(--text-xs);margin-left:auto;cursor:pointer}
  .edit-hint-reset:hover{text-decoration:underline}

  @media print{
    .site-header,.edit-panel,.export-area,.btn,.edit-hint-reset{display:none!important}
    .card{break-inside:avoid;margin-bottom:var(--space-3);border-color:#ccc}
    .sw-wrap{grid-template-columns:1fr 1fr}
    body{font-size:13px;color:#000;background:#fff}
    .fit-card{break-inside:avoid}
    .timeline{break-inside:avoid}
    .advice-box{background:#f5f5f5;border-color:#ddd}
    a{color:#000;text-decoration:none}
  }

.demo-banner{background:#fff8e1;border:1px solid #ffd54f;border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);font-size:var(--text-xs);color:#b28704;margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-2)}
.demo-banner::before{content:"演示模式";font-weight:600;background:#ffd54f;color:#fff;padding:1px 8px;border-radius:var(--radius-sm);font-size:11px}
</style>
</head>
<body>
<div id="app">
<div v-if="demoMode" class="demo-banner">当前加载的是演示数据（陈默 · 虚构），仅供截图与公开展示使用，不会覆盖你的真实档案。去除 ?demo 参数即可恢复自己的数据。</div>
<header>
    <div class="hrow">
      <div class="logo">秋招画像系统 <span>· 人才画像</span></div>
      <div class="spacer"></div>
      <a href="index.html" class="btn">填写信息</a>
      <a href="match.html" class="btn">岗位匹配</a>
      <a href="intention.html" class="btn">意向岗位</a>
      <a href="resume.html" class="btn">简历生成</a>
      <button class="btn" :class="{'btn-primary':editMode}" @click="toggleEdit">{{editMode?'退出编辑':'自定义画像'}}</button>
      <button class="btn btn-primary" @click="doExport('json')">导出 JSON</button>
      <button class="btn btn-primary" @click="doExport('text')">复制文本</button>
      <button class="btn" @click="$refs.importFile.click()">导入 JSON</button>
      <input type="file" ref="importFile" accept=".json" style="display:none" @change="handleImport">
    </div>
  </header>

  <!-- 工作流导航 -->
  <nav class="workflow-nav">
    <a href="index.html" class="workflow-step done"><span class="num">1</span>信息填写</a>
    <span class="workflow-arrow">→</span>
    <a href="match.html" class="workflow-step done"><span class="num">2</span>岗位匹配</a>
    <span class="workflow-arrow">→</span>
    <a href="intention.html" class="workflow-step done"><span class="num">3</span>意向岗位</a>
    <span class="workflow-arrow">→</span>
    <a href="resume.html" class="workflow-step done"><span class="num">4</span>简历生成</a>
  </nav>

  <!-- 空状态 -->
  <div v-if="!loaded" class="empty card">
    <div class="empty-icon"></div>
    <h2>暂无档案数据</h2>
    <p>请先在「信息填写」页面完成基础信息录入，系统将自动为你生成人才画像。</p>
    <div class="empty-steps">
      <span class="empty-step"><span class="num">1</span>填写信息</span>
      <span style="color:var(--ink3)">→</span>
      <span class="empty-step"><span class="num">2</span>自动生成画像</span>
      <span style="color:var(--ink3)">→</span>
      <span class="empty-step"><span class="num">3</span>自定义调整</span>
      <span style="color:var(--ink3)">→</span>
      <span class="empty-step"><span class="num">4</span>导出投递</span>
    </div>
    <a href="index.html" class="btn btn-primary" style="margin-top:8px">去填写信息</a>
  </div>

  <template v-else>
    <!-- 核心概览 -->
    <div class="card">
      <div class="hero">
        <div class="avatar">{{ profileData.name ? profileData.name[0] : '?' }}</div>
        <div class="hero-body">
          <div class="hero-name">{{ profileData.name || '未命名' }}</div>
          <div class="hero-meta">
            {{ profileData.gradSchool }} · {{ profileData.gradMajor }} · {{ profileData.highestDegree }}
            <span v-if="profileData.graduationYear">· {{ profileData.graduationYear }}届</span>
          </div>
          <div class="hero-pitch">{{ portrait.elevatorPitch }}</div>
          <div class="tags">
            <span class="tag" v-for="t in portrait.tags" :key="t">{{ t }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 自定义编辑面板 -->
    <div class="edit-panel" v-if="editMode">
      <div class="edit-title">自定义画像参数 <span style="font-weight:400;font-size:13px;color:var(--ink3)">（修改后点击保存，系统会记住你的偏好）</span></div>

      <div class="edit-section-title" @click="editCollapsed.radar=!editCollapsed.radar" style="cursor:pointer;user-select:none">
        <span class="edit-toggle">{{ editCollapsed.radar ? '▶' : '▼' }}</span> 能力雷达评分（0-5）
      </div>
      <div v-show="!editCollapsed.radar">
        <div class="edit-row" v-for="d in radarDims" :key="d.key">
          <label>{{ d.label }}</label>
          <input type="range" min="0" max="5" step="0.5" v-model.number="custom.radar[d.key]">
          <span class="edit-value" :class="'score-'+Math.round((custom.radar[d.key]??portrait.radar[d.key]))">{{ custom.radar[d.key] ?? portrait.radar[d.key] }}</span>
        </div>
      </div>

      <div class="edit-section-title" @click="editCollapsed.roles=!editCollapsed.roles" style="cursor:pointer;user-select:none">
        <span class="edit-toggle">{{ editCollapsed.roles ? '▶' : '▼' }}</span> 岗位匹配调整
      </div>
      <div v-show="!editCollapsed.roles">
        <table class="edit-table">
          <tr><th>岗位</th><th>自动分数</th><th>自定义分数</th><th>隐藏</th></tr>
          <tr v-for="role in allRoles" :key="role">
            <td>{{ role }}</td>
            <td style="color:var(--ink3)">{{ (portrait._autoRoleFit || portrait.roleFit).find(f=>f.role===role)?.score ?? '-' }}%</td>
            <td><input type="number" min="0" max="100" v-model.number="custom.roleScores[role]" placeholder="留空用自动"></td>
            <td><input type="checkbox" v-model="custom.disabledRoles" :value="role"></td>
          </tr>
        </table>
      </div>

      <div class="edit-section-title" @click="editCollapsed.text=!editCollapsed.text" style="cursor:pointer;user-select:none">
        <span class="edit-toggle">{{ editCollapsed.text ? '▶' : '▼' }}</span> 文本内容调整
      </div>
      <div v-show="!editCollapsed.text">
        <div class="edit-section-title" style="margin-top:8px;font-size:13px;font-weight:500;color:var(--ink2)">一句话定位</div>
        <div class="edit-row"><textarea v-model="custom.elevatorPitch" placeholder="留空用自动生成"></textarea></div>

        <div class="edit-section-title" style="margin-top:8px;font-size:13px;font-weight:500;color:var(--ink2)">标签云（用 / 分隔）</div>
        <div class="edit-row"><input type="text" v-model="custom.tags" placeholder="留空用自动生成"></div>

        <div class="edit-section-title" style="margin-top:8px;font-size:13px;font-weight:500;color:var(--ink2)">核心优势（每行一条）</div>
        <div class="edit-row"><textarea v-model="custom.strengths" placeholder="留空用自动生成"></textarea></div>

        <div class="edit-section-title" style="margin-top:8px;font-size:13px;font-weight:500;color:var(--ink2)">待补短板（每行一条）</div>
        <div class="edit-row"><textarea v-model="custom.gaps" placeholder="留空用自动生成"></textarea></div>
      </div>

      <div class="edit-actions">
<button class="btn btn-primary" @click="saveCustom">保存偏好</button>
          <button class="btn" @click="cancelEdit">取消</button>
          <button class="btn" @click="resetCustom">重置为自动</button>
          <span class="edit-hint-reset" v-if="hasCustom" @click="clearCustom">清空所有自定义</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">◎</span> 经历谱系</div>
      <div class="timeline">
        <div class="t-item" v-for="item in sortedInternships" :key="item._id">
          <div class="t-header">
            <span class="t-company">{{ item.company }}</span>
            <span class="t-role">{{ item.role }}</span>
            <span class="t-time">{{ formatDate(item.start) }} – {{ item.isOngoing ? '至今' : formatDate(item.end) }}</span>
            <span class="t-type">{{ item.employmentType || '实习' }}</span>
          </div>
          <ul class="t-highlights" v-if="itemHighlights(item).length">
            <li v-for="h in itemHighlights(item)" :key="h">{{ h }}</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 能力雷达 -->
    <div class="card">
      <div class="card-title">能力雷达</div>
      <div class="radar-wrap">
        <svg class="radar-svg" :width="radarSize" :height="radarSize" viewBox="0 0 340 340">
          <!-- 网格 -->
          <g v-for="layer in 5" :key="layer">
            <polygon :points="radarGrid(layer)" fill="none" stroke="#e6e3de" stroke-width="1"/>
          </g>
          <!-- 轴线 -->
          <line v-for="(d,i) in radarDims" :key="'a'+i"
            :x1="radarCx" :y1="radarCy"
            :x2="radarPoint(i,5).x" :y2="radarPoint(i,5).y"
            stroke="#e6e3de" stroke-width="1"/>
          <!-- 数据区域 -->
          <polygon :points="radarDataPoly" fill="rgba(43,93,79,0.12)" stroke="var(--accent)" stroke-width="2"/>
          <!-- 数据点 -->
          <circle v-for="(d,i) in radarDims" :key="'p'+i"
            :cx="radarPoint(i,portrait.radar[d.key]).x"
            :cy="radarPoint(i,portrait.radar[d.key]).y"
            r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
          <!-- 标签 -->
          <text v-for="(d,i) in radarDims" :key="'l'+i"
            :x="radarLabel(i).x" :y="radarLabel(i).y"
            text-anchor="middle" dominant-baseline="middle"
            font-size="12" fill="#5c5c5c">{{ d.label }}</text>
        </svg>
        <div class="radar-legend">
          <div class="radar-legend-item" v-for="d in radarDims" :key="d.key">
            <span style="min-width:72px">{{ d.label }}</span>
            <div class="radar-legend-bar"><div class="radar-legend-fill" :style="{width:(portrait.radar[d.key]/5*100)+'%'}"></div></div>
            <span class="radar-legend-score">{{ portrait.radar[d.key] }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 岗位适配 -->
    <div class="card">
      <div class="card-title"><span class="icon">◉</span> 岗位适配矩阵</div>
      <div class="fit-grid">
        <div v-for="f in portrait.roleFit" :key="f.role"
          class="fit-card" :class="f.level">
          <div class="fit-header">
            <span class="fit-name">{{ f.role }}</span>
            <span v-if="f.isTop" class="fit-badge" style="background:#2b5d4f;color:#fff">首选</span>
            <span class="fit-badge" :class="f.level">{{ f.level==='strong'?'强匹配':f.level==='medium'?'中匹配':'弱匹配' }}</span>
          </div>
          <div class="fit-bar"><div class="fit-bar-fill" :class="f.level" :style="{width:f.score+'%'}"></div></div>
          <ul class="fit-reasons">
            <li v-for="r in f.reasons" :key="r">{{ r }}</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 优势 & 短板 -->
    <div class="sw-wrap">
      <div class="card sw-strength">
        <div class="card-title"><span class="icon">▲</span> 核心优势</div>
        <ul class="sw-list">
          <li v-for="s in portrait.strengths" :key="s">{{ s }}</li>
        </ul>
      </div>
      <div class="card sw-weak">
        <div class="card-title"><span class="icon">▼</span> 待补短板</div>
        <ul class="sw-list">
          <li v-for="w in portrait.gaps" :key="w">{{ w }}</li>
        </ul>
      </div>
    </div>

    <!-- 投递建议 -->
    <div class="card">
      <div class="card-title">投递策略建议</div>
      <div class="advice-box" v-html="portrait.advice"></div>
    </div>

    <!-- 文本导出预览 -->
    <div class="card" v-if="showTextExport">
      <div class="card-title">文本版画像（可直接粘贴）</div>
      <textarea class="text-export" readonly v-model="textExport"></textarea>
    </div>
  </template>
</div>

<script type="module">
import { RADAR_DIMS, ROLE_TEMPLATES, analyzePortrait, applyCustomOverrides } from './src/portrait-engine.js';
import { getProfile } from './src/demo-profile.js';

const { createApp } = Vue;

const LS_KEY = 'qiuzhao_profile_v4';


createApp({
  data() {
    return {
      loaded: false,
      profileData: {},
      portrait: {},
      demoMode: false,
      showTextExport: false,
      textExport: '',
      editMode: false,
      editSnapshot: null,
      isDirty: false,
      editCollapsed: {
        radar: false,
        roles: false,
        text: false,
      },
      custom: {
        radar: {},
        roleScores: {},
        disabledRoles: [],
        elevatorPitch: '',
        tags: '',
        strengths: '',
        gaps: '',
      },
      hasCustom: false,
    };
  },
  computed: {
    radarDims() { return RADAR_DIMS; },
    radarSize() { return 340; },
    radarCx() { return 170; },
    radarCy() { return 170; },
    radarRadius() { return 110; },
    sortedInternships() {
      const arr = [...(this.profileData.internships || [])].filter(i => i.company);
      arr.sort((a,b) => (b.start || '').localeCompare(a.start || ''));
      return arr;
    },
    radarDataPoly() {
      return RADAR_DIMS.map((d,i) => {
        const p = this.radarPoint(i, this.portrait.radar[d.key]);
        return `${p.x},${p.y}`;
      }).join(' ');
    },
    allRoles() {
      return ROLE_TEMPLATES.map(rt => rt.role);
    },
  },
  watch: {
    custom: {
      deep: true,
      handler() {
        if (this.editMode) {
          this.isDirty = true;
          this.applyCurrentCustom();
        }
      }
    }
  },
  methods: {
    loadData() {
      this.demoMode = new URLSearchParams(window.location.search).has('demo');
      try {
        if (this.demoMode) {
          this.profileData = getProfile();
          const base = analyzePortrait(this.profileData);
          this.portrait = applyCustomOverrides(base, this.custom);
          this.loaded = true;
          return;
        }
        let raw = localStorage.getItem(LS_KEY);
        if (!raw) raw = localStorage.getItem('qiuzhao_profile_v3');
        if (raw) {
          this.profileData = window.QZ_SCHEMA ? window.QZ_SCHEMA.migrate(JSON.parse(raw)) : JSON.parse(raw);
          const customRaw = localStorage.getItem('qiuzhao_portrait_custom');
          const parsedCustom = customRaw ? JSON.parse(customRaw) : null;
          this.mergeCustom(parsedCustom);
          this.hasCustom = customRaw && Object.keys(parsedCustom || {}).length > 0;
          const base = analyzePortrait(this.profileData);
          this.portrait = applyCustomOverrides(base, this.custom);
          this.loaded = true;
        }
      } catch(e) {
        console.error(e);
      }
    },
    ensureCustomStructure() {
      if (!this.custom) this.custom = {};
      if (!this.custom.radar) this.custom.radar = {};
      if (!this.custom.roleScores) this.custom.roleScores = {};
      if (!this.custom.disabledRoles) this.custom.disabledRoles = [];
      if (this.custom.elevatorPitch === undefined) this.custom.elevatorPitch = '';
      if (this.custom.tags === undefined) this.custom.tags = '';
      if (this.custom.strengths === undefined) this.custom.strengths = '';
      if (this.custom.gaps === undefined) this.custom.gaps = '';
    },
    mergeCustom(raw) {
      this.ensureCustomStructure();
      if (!raw) return;
      if (raw.radar) Object.assign(this.custom.radar, raw.radar);
      if (raw.roleScores) Object.assign(this.custom.roleScores, raw.roleScores);
      if (raw.disabledRoles) this.custom.disabledRoles = [...raw.disabledRoles];
      if (raw.elevatorPitch !== undefined) this.custom.elevatorPitch = raw.elevatorPitch;
      if (raw.tags !== undefined) this.custom.tags = raw.tags;
      if (raw.strengths !== undefined) this.custom.strengths = raw.strengths;
      if (raw.gaps !== undefined) this.custom.gaps = raw.gaps;
    },
    applyCurrentCustom() {
      const base = analyzePortrait(this.profileData);
      this.portrait = applyCustomOverrides(base, this.custom);
    },
    toggleEdit() {
      this.editMode = !this.editMode;
      if (this.editMode) {
        // 进入编辑时保存快照，用于取消时恢复
        this.editSnapshot = JSON.parse(JSON.stringify(this.custom));
        this.isDirty = false;
        // 将当前画像值预填入 custom，避免滑块显示中间值
        RADAR_DIMS.forEach(d => {
          if (this.custom.radar[d.key] === undefined || this.custom.radar[d.key] === null || this.custom.radar[d.key] === '') {
            this.custom.radar[d.key] = this.portrait.radar[d.key];
          }
        });
      } else {
        this.applyCurrentCustom();
        this.isDirty = false;
      }
    },
    cancelEdit() {
      if (this.isDirty && !confirm('有未保存的修改，确定要放弃吗？')) return;
      this.custom = JSON.parse(JSON.stringify(this.editSnapshot));
      this.editMode = false;
      this.isDirty = false;
      const base = analyzePortrait(this.profileData);
      this.portrait = applyCustomOverrides(base, this.custom);
    },
    saveCustom() {
      localStorage.setItem('qiuzhao_portrait_custom', JSON.stringify(this.custom));
      this.hasCustom = true;
      this.editSnapshot = JSON.parse(JSON.stringify(this.custom));
      this.isDirty = false;
      this.applyCurrentCustom();
      alert('自定义偏好已保存！');
    },
    resetCustom() {
      this.custom = {
        radar: {},
        roleScores: {},
        disabledRoles: [],
        elevatorPitch: '',
        tags: '',
        strengths: '',
        gaps: '',
      };
      this.hasCustom = false;
      localStorage.removeItem('qiuzhao_portrait_custom');
      this.editSnapshot = JSON.parse(JSON.stringify(this.custom));
      this.isDirty = false;
      const base = analyzePortrait(this.profileData);
      this.portrait = base;
      alert('已恢复为全自动生成');
    },
    clearCustom() {
      if (!confirm('确定清空所有自定义设置？')) return;
      this.resetCustom();
    },
    formatDate(m) {
      if (!m || m === '0001-01') return '';
      return m.replace('-', '.');
    },
    itemHighlights(item) {
      const h = [];
      const r = (item.responsibilities || '').trim();
      if (r) {
        const lines = r.split('\n').filter(l => l.trim());
        if (lines[0]) h.push(lines[0].replace(/^\d+[、.．]\s*/, '').trim());
      }
      if (item.metrics) h.push('成果：' + item.metrics.trim());
      return h;
    },
    radarPoint(idx, score) {
      const angle = -Math.PI / 2 + (idx * 2 * Math.PI / RADAR_DIMS.length);
      const r = (score / 5) * this.radarRadius;
      return {
        x: this.radarCx + r * Math.cos(angle),
        y: this.radarCy + r * Math.sin(angle)
      };
    },
    radarLabel(idx) {
      const angle = -Math.PI / 2 + (idx * 2 * Math.PI / RADAR_DIMS.length);
      const r = this.radarRadius + 22;
      return {
        x: this.radarCx + r * Math.cos(angle),
        y: this.radarCy + r * Math.sin(angle)
      };
    },
    radarGrid(layer) {
      return RADAR_DIMS.map((_,i) => {
        const p = this.radarPoint(i, layer);
        return `${p.x},${p.y}`;
      }).join(' ');
    },
    doExport(type) {
      if (type === 'json') {
        const out = {
          _portraitVersion: 1,
          _generatedAt: new Date().toISOString(),
          name: this.profileData.name,
          elevatorPitch: this.portrait.elevatorPitch,
          tags: this.portrait.tags,
          radar: this.portrait.radar,
          roleFit: this.portrait.roleFit,
          strengths: this.portrait.strengths,
          gaps: this.portrait.gaps,
          advice: this.portrait.advice,
        };
        const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `人才画像_${this.profileData.name || '未命名'}_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } else {
        const lines = [
          `【${this.profileData.name || '人才画像'}】`,
          '',
          this.portrait.elevatorPitch,
          '',
          '核心标签：' + this.portrait.tags.join(' / '),
          '',
          '能力雷达（0-5分）：',
          ...RADAR_DIMS.map(d => `  ${d.label}：${this.portrait.radar[d.key]}`),
          '',
          '岗位适配度：',
          ...this.portrait.roleFit.map(f => `  ${f.role}：${f.score}% [${f.level==='strong'?'强匹配':f.level==='medium'?'中匹配':'弱匹配'}]`),
          '',
          '核心优势：',
          ...this.portrait.strengths.map(s => `  · ${s}`),
          '',
          '待补短板：',
          ...this.portrait.gaps.map(g => `  · ${g}`),
          '',
          '投递策略：',
          this.portrait.advice.replace(/<[^>]+>/g, ''),
        ];
        this.textExport = lines.join('\n');
        this.showTextExport = true;
        this.$nextTick(() => {
          const el = document.querySelector('.text-export');
          if (el) { el.select(); document.execCommand('copy'); }
        });
      }
    },
    handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || typeof data !== 'object') throw new Error('文件格式错误');
          // 支持两种格式：原始档案（含 schemaVersion）或导出的画像
          if (data.schemaVersion) {
            // 原始档案
            const migrated = window.QZ_SCHEMA ? window.QZ_SCHEMA.migrate(data) : data;
            localStorage.setItem(LS_KEY, JSON.stringify(migrated));
            this.profileData = migrated;
            const base = analyzePortrait(this.profileData);
            this.portrait = applyCustomOverrides(base, this.custom);
            this.loaded = true;
            alert('档案导入成功！');
          } else if (data._portraitVersion) {
            // 导出的画像文件（只读展示，不覆盖原始档案）
            alert('检测到画像导出文件，将以只读模式展示。如需恢复原始档案，请导入带 schemaVersion 的档案文件。');
            this.profileData = { name: data.name || '导入画像' };
            this.portrait = {
              elevatorPitch: data.elevatorPitch || '',
              tags: data.tags || [],
              radar: data.radar || {},
              roleFit: data.roleFit || [],
              strengths: data.strengths || [],
              gaps: data.gaps || [],
              advice: data.advice || '',
            };
            this.loaded = true;
          } else {
            throw new Error('无法识别的 JSON 格式');
          }
        } catch (err) {
          alert('导入失败：' + err.message);
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    }
  },
  created() {
    this.demoMode = new URLSearchParams(window.location.search).has('demo');
    try {
      if (this.demoMode) {
        this.profileData = getProfile();
        const base = analyzePortrait(this.profileData);
        this.portrait = applyCustomOverrides(base, this.custom);
        this.loaded = true;
        return;
      }
      let raw = localStorage.getItem(LS_KEY);
      if (!raw) raw = localStorage.getItem('qiuzhao_profile_v3');
      if (raw) {
        this.profileData = window.QZ_SCHEMA ? window.QZ_SCHEMA.migrate(JSON.parse(raw)) : JSON.parse(raw);
        const customRaw = localStorage.getItem('qiuzhao_portrait_custom');
        const parsedCustom = customRaw ? JSON.parse(customRaw) : null;
        this.mergeCustom(parsedCustom);
        this.hasCustom = customRaw && Object.keys(parsedCustom || {}).length > 0;
        const base = analyzePortrait(this.profileData);
        this.portrait = applyCustomOverrides(base, this.custom);
        this.loaded = true;
      }
    } catch(e) {
      console.error(e);
    }
    window.addEventListener('beforeunload', (e) => {
      if (this.editMode && this.isDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }
}).mount('#app');
</script>
</body>
</html>
